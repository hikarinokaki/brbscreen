<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Acan - Floating Model & Collisions</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #ui {
			position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
		#ui {
			display: none;
		}
		@keyframes bgColorChange {
			from {
				background-color: grey;
			}
			to {
				background-color: #4bbda64f;
			}
		}

		body {
			animation: bgColorChange 0.6s forwards;
		}
    </style>
  <script type="module" crossorigin src="/brbscreen/assets/index-TlVlaLtu.js"></script>
</head>
<body>
    <div id="ui">
        Type !throw in chat to launch objects<br>
        (Press 'Space' to test)
        <div id="target-coordinates">Target Coords: (x: 0, y: 0, z: 0)</div>
    </div>
</body>
</html>
